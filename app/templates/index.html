<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>
<style>
body { font-family: Arial; background:#f2f2f2; text-align:center; padding:20px }
.card { background:white; padding:20px; margin:15px auto; max-width:360px; border-radius:12px }
.timer { font-size:36px }
.sim { color:red }
</style>
</head>
<body>

<h2>⏱ Work Timers</h2>
<div id="nowTitle">טוען...</div>

<div class="card">
  <h3>טיימר 1</h3>
  <div class="timer" id="t1">00:00:00</div>
  <button onclick="cmd(1,'start')">Start</button>
  <button onclick="cmd(1,'stop')">Stop</button>
  <button onclick="cmd(1,'reset')">Reset</button>
</div>

<div class="card">
  <h3>טיימר 2</h3>
  <div class="timer" id="t2">00:00:00</div>
  <button onclick="cmd(2,'start')">Start</button>
  <button onclick="cmd(2,'stop')">Stop</button>
  <button onclick="cmd(2,'reset')">Reset</button>
</div>

<div class="card">
  <button onclick="logNow()">✏️ עדכון ידני ל-Google Sheet</button>
</div>

<div class="card">
  <h3>🧪 סימולציה</h3>
  <input type="date" id="sd"><br><br>
  <input type="time" id="st"><br><br>
  <button onclick="startSim()">הפעל</button>
  <button onclick="stopSim()">כבה</button>
</div>

<script>
async function refresh(){
  const r = await fetch("/api/status");
  const d = await r.json();
  const t = document.getElementById("nowTitle");
  t.innerText = d.now_str + (d.simulation ? " (סימולציה)" : "");
  t.className = d.simulation ? "sim" : "";
  document.getElementById("t1").innerText = d.timers[0];
  document.getElementById("t2").innerText = d.timers[1];
}
setInterval(refresh,1000); refresh();

function cmd(i,a){ fetch(`/api/timer/${i}/${a}`,{method:"POST"}); }
function logNow(){ fetch("/api/log",{method:"POST"}).then(()=>alert("עודכן")); }

function startSim(){
  fetch("/api/sim/start",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({datetime: sd.value+" "+st.value})
  });
}
function stopSim(){ fetch("/api/sim/stop",{method:"POST"}); }
</script>

</body>
</html>
