<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

#nowTitle {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

.sim {
  color: red;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 22px;
  margin: 18px auto;
  max-width: 360px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.timer {
  font-size: 38px;
  margin: 12px 0;
}

button {
  font-size: 18px;
  padding: 12px 22px;
  margin: 6px;
  cursor: pointer;
}

.sim-box {
  background: #fff;
  padding: 18px;
  border-radius: 12px;
  max-width: 360px;
  margin: 20px auto;
}
</style>
</head>

<body>

<h1>⏱ Work Timers</h1>
<div id="nowTitle">טוען...</div>

<!-- TIMER 1 -->
<div class="card">
  <h2>טיימר 1</h2>
  <div class="timer" id="timer-1">00:00:00</div>
  <button onclick="startTimer(1)">▶ Start</button>
  <button onclick="stopTimer(1)">⏸ Stop</button>
  <button onclick="resetTimer(1)">🔄 Reset</button>
  <br>
  <button onclick="adjustTimer(1, 300)">➕ 5 דקות</button>
  <button onclick="adjustTimer(1, -600)">➖ 10 דקות</button>
</div>

<!-- TIMER 2 -->
<div class="card">
  <h2>טיימר 2</h2>
  <div class="timer" id="timer-2">00:00:00</div>
  <button onclick="startTimer(2)">▶ Start</button>
  <button onclick="stopTimer(2)">⏸ Stop</button>
  <button onclick="resetTimer(2)">🔄 Reset</button>
  <br>
  <button onclick="adjustTimer(2, 300)">➕ 5 דקות</button>
  <button onclick="adjustTimer(2, -600)">➖ 10 דקות</button>
</div>

<!-- GOOGLE SHEET -->
<div class="card">
  <button onclick="logNow()">✏️ עדכון ידני ל-Google Sheet</button>
</div>

<!-- SIMULATION -->
<div class="sim-box">
  <h3>🧪 סימולציה</h3>
  <input type="date" id="simDate"><br><br>
  <input type="time" id="simTime"><br><br>
  <button onclick="startSim()">הפעל סימולציה</button>
  <button onclick="stopSim()">כבה סימולציה</button>
</div>

<script>
const BASE = window.location.origin;

// ================= STATUS =================
async function refreshStatus(){
  try {
    const r = await fetch(`${BASE}/api/status`);
    const d = await r.json();

    const title = document.getElementById("nowTitle");
    title.innerText = d.now_str + (d.simulation ? " (סימולציה)" : "");
    title.className = d.simulation ? "sim" : "";

    d.timers.forEach((t, i) => {
      document.getElementById(`timer-${i+1}`).innerText = t;
    });
  } catch(e){
    console.error("Status error:", e);
  }
}

setInterval(refreshStatus, 1000);
refreshStatus();

// ================= TIMER ACTIONS =================
function startTimer(i){
  fetch(`${BASE}/api/timer/${i}/start`, { method: "POST" });
}

function stopTimer(i){
  fetch(`${BASE}/api/timer/${i}/stop`, { method: "POST" });
}

function resetTimer(i){
  fetch(`${BASE}/api/timer/${i}/reset`, { method: "POST" });
}

// ================= ADJUST TIME =================
function adjustTimer(i, delta){
  fetch(`${BASE}/api/timer/${i}/adjust`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ delta: delta })
  })
  .then(r => r.json())
  .then(d => {
    if(d.error){
      alert("❌ " + d.error);
    }
  });
}

// ================= GOOGLE SHEET =================
function logNow(){
  fetch(`${BASE}/api/log-now`, { method: "POST" })
    .then(r => r.json())
    .then(d => {
      if(d.ok){
        alert("✅ עודכן ב-Google Sheet");
      } else {
        alert("❌ " + d.message);
      }
    });
}

// ================= SIMULATION =================
function startSim(){
  const d = simDate.value;
  const t = simTime.value;
  if(!d || !t){
    alert("בחר תאריך ושעה");
    return;
  }

  fetch(`${BASE}/api/sim/start`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ datetime: `${d} ${t}` })
  });
}

function stopSim(){
  fetch(`${BASE}/api/sim/stop`, { method: "POST" });
}
</script>

</body>
</html>
