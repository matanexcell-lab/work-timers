<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

#nowTitle {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

.sim {
  color: red;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 20px;
  margin: 15px auto;
  max-width: 320px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.timer {
  font-size: 34px;
  margin: 10px 0;
}

button {
  font-size: 18px;
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
}

hr {
  margin: 25px 0;
}

.sim-box {
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  max-width: 320px;
  margin: auto;
}
</style>
</head>

<body>

<h1>⏱ Work Timers</h1>
<div id="nowTitle">טוען...</div>

<!-- TIMER 1 -->
<div class="card">
  <h2>טיימר 1</h2>
  <div class="timer" id="timer-1">00:00:00</div>
  <button onclick="start(1)">▶ Start</button>
  <button onclick="stop(1)">⏸ Stop</button>
  <button onclick="resetT(1)">🔄 Reset</button>
</div>

<!-- TIMER 2 -->
<div class="card">
  <h2>טיימר 2</h2>
  <div class="timer" id="timer-2">00:00:00</div>
  <button onclick="start(2)">▶ Start</button>
  <button onclick="stop(2)">⏸ Stop</button>
  <button onclick="resetT(2)">🔄 Reset</button>
</div>

<!-- GOOGLE SHEET -->
<div class="card">
  <button onclick="logNow()">✏️ עדכון ידני ל-Google Sheet</button>
</div>

<!-- SIMULATION -->
<div class="sim-box">
  <h3>🧪 סימולציה</h3>
  <input type="date" id="simDate"><br><br>
  <input type="time" id="simTime"><br><br>
  <button onclick="startSim()">הפעל סימולציה</button>
  <button onclick="stopSim()">כבה סימולציה</button>
</div>

<script>
const BASE = window.location.origin;

// ===== STATUS REFRESH =====
async function refreshStatus(){
  try {
    const r = await fetch(`${BASE}/api/status`);
    const d = await r.json();

    const title = document.getElementById("nowTitle");
    title.innerText = d.now_str + (d.simulation ? " (סימולציה)" : "");
    title.className = d.simulation ? "sim" : "";

    d.timers.forEach((t, i) => {
      document.getElementById(`timer-${i+1}`).innerText = t;
    });
  } catch(e) {
    console.error("Status error", e);
  }
}

setInterval(refreshStatus, 1000);
refreshStatus();

// ===== TIMER ACTIONS =====
function start(i){
  fetch(`${BASE}/api/timer/${i}/start`, { method: "POST" });
}

function stop(i){
  fetch(`${BASE}/api/timer/${i}/stop`, { method: "POST" });
}

function resetT(i){
  fetch(`${BASE}/api/timer/${i}/reset`, { method: "POST" });
}

// ===== GOOGLE SHEET =====
function logNow(){
  fetch(`${BASE}/api/log`, { method: "POST" })
    .then(() => alert("✅ עודכן ב-Google Sheet"));
}

// ===== SIMULATION =====
function startSim(){
  const d = simDate.value;
  const t = simTime.value;
  if(!d || !t){
    alert("בחר תאריך ושעה");
    return;
  }

  fetch(`${BASE}/api/sim/start`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ datetime: `${d} ${t}` })
  });
}

function stopSim(){
  fetch(`${BASE}/api/sim/stop`, { method: "POST" });
}
</script>

</body>
</html>
