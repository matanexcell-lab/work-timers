<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Work Timers</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f6f7; margin:0; }
    .wrap { max-width:720px; margin:0 auto; padding:16px; }
    h1 { text-align:center; margin:10px 0 6px; }
    .now { text-align:center; color:#333; margin-bottom:10px; }
    .banner { border-radius:10px; padding:10px 12px; margin:10px 0; }
    .ok { background:#e8fff0; border:1px solid #bfe7c8; }
    .bad { background:#ffecec; border:1px solid #f0b4b4; }
    .banner .title { font-weight:700; margin-bottom:4px; }
    .muted { color:#666; font-size:13px; }

    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    .btn.primary { background:#2e7d32; color:#fff; border:none; }
    .btn.stop { background:#1976d2; color:#fff; border:none; }
    .btn.reset { background:#6d4c41; color:#fff; border:none; }
    .btn.gray { background:#eceff1; }
    .card { background:#fff; border-radius:16px; padding:14px; margin:12px 0; box-shadow:0 1px 8px rgba(0,0,0,.06); }
    .timerTitle { text-align:center; font-size:20px; font-weight:700; margin:6px 0; }
    .time { text-align:center; font-size:64px; font-weight:800; letter-spacing:1px; margin:10px 0; }

    .setBox { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:10px; }
    input[type="text"] { padding:10px 12px; border-radius:10px; border:1px solid #ccc; font-size:18px; width:240px; text-align:center; direction:ltr; }
    .small { font-size:12px; color:#777; text-align:center; }

    .footer { height:20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⏱️ Work Timers</h1>
    <div class="now" id="nowLine">טוען...</div>

    <!-- SHEET banner -->
    <div id="sheetBanner" class="banner ok" style="display:none;">
      <div class="title">Google Sheet</div>
      <div id="sheetMsg"></div>
      <div class="muted" id="sheetAt"></div>
    </div>

    <!-- CALENDAR banner -->
    <div id="calBanner" class="banner ok" style="display:none;">
      <div class="title">Google Calendar</div>
      <div id="calMsg"></div>
      <div class="muted" id="calAt"></div>
    </div>

    <div class="card">
      <div class="row">
        <button class="btn gray" id="btnLogNow">📄 עדכן עכשיו ל-Sheet</button>
        <button class="btn gray" id="btnCalNow">📅 עדכן עכשיו ל-Calendar</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn gray" id="btnSimStart">🧪 הפעל סימולציה</button>
        <button class="btn gray" id="btnSimStop">עצור סימולציה</button>
      </div>
      <div class="small" id="modeLine"></div>
    </div>

    <!-- Timer 1 -->
    <div class="card">
      <div class="timerTitle">טיימר 1</div>
      <div class="time" id="t1">00:00:00</div>

      <div class="row">
        <button class="btn primary" onclick="post('/api/timer/1/start')">Start ▶</button>
        <button class="btn stop" onclick="post('/api/timer/1/stop')">Stop ⏸</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn reset" onclick="post('/api/timer/1/reset')">Reset 🔄</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn" onclick="adjust(1, +300)">+5 דק</button>
        <button class="btn" onclick="adjust(1, -600)">-10 דק</button>
      </div>

      <div class="setBox">
        <input id="set1" type="text" inputmode="numeric" placeholder="HH:MM:SS / MM:SS / HH" />
        <button class="btn" onclick="setFromInput(1)">Set</button>
      </div>
    </div>

    <!-- Timer 2 -->
    <div class="card">
      <div class="timerTitle">טיימר 2</div>
      <div class="time" id="t2">00:00:00</div>

      <div class="row">
        <button class="btn primary" onclick="post('/api/timer/2/start')">Start ▶</button>
        <button class="btn stop" onclick="post('/api/timer/2/stop')">Stop ⏸</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn reset" onclick="post('/api/timer/2/reset')">Reset 🔄</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn" onclick="adjust(2, +300)">+5 דק</button>
        <button class="btn" onclick="adjust(2, -600)">-10 דק</button>
      </div>

      <div class="setBox">
        <input id="set2" type="text" inputmode="numeric" placeholder="HH:MM:SS / MM:SS / HH" />
        <button class="btn" onclick="setFromInput(2)">Set</button>
      </div>
    </div>

    <div class="footer"></div>
  </div>

<script>
  async function post(url, body) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: body ? JSON.stringify(body) : '{}'
      });
      await refresh();
      return res;
    } catch (e) {
      console.log(e);
    }
  }

  async function adjust(i, delta) {
    await post(`/api/timer/${i}/adjust`, {delta});
  }

  function parseTimeToSeconds(s) {
    // supports: HH:MM:SS , MM:SS , HH
    s = (s || '').trim();
    if (!s) return null;

    if (s.includes(':')) {
      const parts = s.split(':').map(x => x.trim());
      if (parts.some(p => p === '' || isNaN(Number(p)))) return null;

      if (parts.length === 2) {
        const mm = Number(parts[0]);
        const ss = Number(parts[1]);
        return mm*60 + ss;
      }
      if (parts.length === 3) {
        const hh = Number(parts[0]);
        const mm = Number(parts[1]);
        const ss = Number(parts[2]);
        return hh*3600 + mm*60 + ss;
      }
      return null;
    }

    // only number = hours
    if (isNaN(Number(s))) return null;
    return Number(s) * 3600;
  }

  async function setFromInput(i) {
    const val = document.getElementById(`set${i}`).value;
    const sec = parseTimeToSeconds(val);
    if (sec === null) {
      alert("פורמט לא תקין. נסה HH:MM:SS או MM:SS או HH");
      return;
    }
    await post(`/api/timer/${i}/set`, {seconds: sec});
  }

  function setBanner(elBanner, ok, title, msg, at) {
    elBanner.style.display = 'block';
    elBanner.className = 'banner ' + (ok ? 'ok' : 'bad');
    if (title === 'sheet') {
      document.getElementById('sheetMsg').textContent = msg || '';
      document.getElementById('sheetAt').textContent  = at ? at : '';
    } else {
      document.getElementById('calMsg').textContent = msg || '';
      document.getElementById('calAt').textContent  = at ? at : '';
    }
  }

  async function refresh() {
    const r = await fetch('/api/status');
    const data = await r.json();

    document.getElementById('nowLine').textContent =
      (data.mode ? `(${data.mode.toUpperCase()}) ` : '') + (data.now_str || '');

    document.getElementById('modeLine').textContent =
      data.simulation ? 'סימולציה פעילה' : 'מצב אמיתי';

    if (data.timers && data.timers.length >= 2) {
      document.getElementById('t1').textContent = data.timers[0];
      document.getElementById('t2').textContent = data.timers[1];
    }

    if (data.sheet) {
      setBanner(
        document.getElementById('sheetBanner'),
        !!data.sheet.ok,
        'sheet',
        (data.sheet.msg || (data.sheet.ok ? 'OK' : 'שגיאה')),
        data.sheet.at || ''
      );
    }
    if (data.calendar) {
      setBanner(
        document.getElementById('calBanner'),
        !!data.calendar.ok,
        'cal',
        (data.calendar.msg || (data.calendar.ok ? 'OK' : 'שגיאה')),
        data.calendar.at || ''
      );
    }
  }

  document.getElementById('btnLogNow').addEventListener('click', async () => {
    await post('/api/log-now');
  });

  document.getElementById('btnCalNow').addEventListener('click', async () => {
    await post('/api/calendar/update-now');
  });

  document.getElementById('btnSimStart').addEventListener('click', async () => {
    const dt = prompt("הכנס תאריך ושעה (YYYY-MM-DD HH:MM)", "2026-01-07 08:00");
    if (!dt) return;
    await post('/api/sim/start', {datetime: dt});
  });

  document.getElementById('btnSimStop').addEventListener('click', async () => {
    await post('/api/sim/stop');
  });

  // Polling (לא משנה אם זה כל שנייה/דקה – ה-AUTO כבר סלחני)
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
