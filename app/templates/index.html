<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>
<style>
body { font-family: Arial; text-align:center; background:#f2f2f2; padding:20px }
.card { background:white; padding:20px; margin:15px auto; max-width:360px; border-radius:12px }
.timer { font-size:36px; margin:10px }
button { font-size:16px; margin:4px; padding:10px 18px }
.sim { color:red }
</style>
</head>
<body>

<h1>⏱ Work Timers</h1>
<div id="now"></div>

<div class="card">
  <h3>טיימר 1</h3>
  <div class="timer" id="t1">00:00:00</div>
  <button onclick="start(1)">Start</button>
  <button onclick="stop(1)">Stop</button>
  <button onclick="resetT(1)">Reset</button><br>
  <button onclick="adj(1,300)">+5 דק'</button>
  <button onclick="adj(1,-600)">-10 דק'</button>
</div>

<div class="card">
  <h3>טיימר 2</h3>
  <div class="timer" id="t2">00:00:00</div>
  <button onclick="start(2)">Start</button>
  <button onclick="stop(2)">Stop</button>
  <button onclick="resetT(2)">Reset</button><br>
  <button onclick="adj(2,300)">+5 דק'</button>
  <button onclick="adj(2,-600)">-10 דק'</button>
</div>

<div class="card">
  <button onclick="logNow()">עדכון ידני ל-Google Sheet</button>
</div>

<div class="card">
  <h3>סימולציה</h3>
  <input type="date" id="d"><br>
  <input type="time" id="t"><br>
  <button onclick="simStart()">הפעל</button>
  <button onclick="simStop()">כבה</button>
</div>

<script>
async function refresh(){
  const r = await fetch("/api/status");
  const d = await r.json();
  document.getElementById("now").innerHTML =
    d.now_str + (d.simulation ? " <span class='sim'>(סימולציה)</span>" : "");
  document.getElementById("t1").innerText = d.timers[0];
  document.getElementById("t2").innerText = d.timers[1];
}
setInterval(refresh,1000); refresh();

const p=(u,o={})=>fetch(u,{method:"POST",headers:{'Content-Type':'application/json'},...o});

function start(i){p(`/api/timer/${i}/start`)}
function stop(i){p(`/api/timer/${i}/stop`)}
function resetT(i){p(`/api/timer/${i}/reset`)}
function adj(i,s){p(`/api/timer/${i}/adjust`,{body:JSON.stringify({delta:s})})}
function logNow(){p(`/api/log-now`).then(()=>alert("עודכן"))}
function simStart(){
  p(`/api/sim/start`,{body:JSON.stringify({datetime:`${d.value} ${t.value}`})})
}
function simStop(){p(`/api/sim/stop`)}
</script>
</body>
</html>
