<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background:#f3f3f3; text-align:center; }
.card { background:#fff; margin:12px auto; padding:16px; max-width:380px; border-radius:12px; }
.timer { font-size:44px; margin:10px 0; }
button { padding:8px 14px; margin:4px; font-size:15px; }
input { padding:6px; font-size:16px; width:220px; text-align:center; }
.ok { background:#e6f6e6; color:#1a7f1a; padding:10px; border-radius:8px; margin:8px; }
.err { background:#fde6e6; color:#b00020; padding:10px; border-radius:8px; margin:8px; }
.small { font-size:12px; opacity:0.8; }
</style>
</head>

<body>

<h1>⏱ Work Timers</h1>
<div id="now"></div>

<div id="sheetStatus"></div>
<div id="calendarStatus"></div>

<div id="timers"></div>

<div class="card">
  <button onclick="logSheet()">📤 עדכון ידני ל-Google Sheet</button><br><br>
  <button onclick="logCalendar()">📅 עדכון ידני ליומן</button>
</div>

<script>
async function api(url, options={}) {
  const res = await fetch(url, {
    headers: {"Content-Type":"application/json"},
    ...options
  });
  return res.json();
}

function renderStatus(el, data, title) {
  if (!data || !data.msg) {
    document.getElementById(el).innerHTML = "";
    return;
  }
  const cls = data.ok ? "ok" : "err";
  document.getElementById(el).innerHTML = `
    <div class="${cls}">
      <b>${title}</b><br>
      ${data.msg}<br>
      ${data.calendar_id ? "calendar_id: "+data.calendar_id+"<br>" : ""}
      ${data.event_id ? "event_id: "+data.event_id+"<br>" : ""}
      <span class="small">${data.at || ""}</span>
    </div>
  `;
}

function renderTimers(timers) {
  const el = document.getElementById("timers");
  el.innerHTML = "";

  timers.forEach((t, idx) => {
    const i = idx + 1;
    el.innerHTML += `
      <div class="card">
        <h3>טיימר ${i}</h3>
        <div class="timer">${t}</div>

        <button onclick="timer(${i},'start')">▶ Start</button>
        <button onclick="timer(${i},'stop')">⏸ Stop</button><br>
        <button onclick="timer(${i},'reset')">🔄 Reset</button><br>

        <button onclick="adjust(${i},300)">+5 דקות</button>
        <button onclick="adjust(${i},-600)">-10 דקות</button><br>

        <input id="set${i}" placeholder="HH:MM:SS / MM:SS / HH">
        <button onclick="setTime(${i})">Set</button>
      </div>
    `;
  });
}

async function refresh() {
  const s = await api("/api/status");

  document.getElementById("now").innerText =
    s.now_str + (s.simulation ? " (SIM)" : " (REAL)");

  renderStatus("sheetStatus", s.sheet, "Google Sheet");
  renderStatus("calendarStatus", s.calendar, "Google Calendar");

  renderTimers(s.timers);
}

async function timer(i, action) {
  await api(`/api/timer/${i}/${action}`, {method:"POST"});
  refresh();
}

async function adjust(i, delta) {
  await api(`/api/timer/${i}/adjust`, {
    method:"POST",
    body:JSON.stringify({delta})
  });
  refresh();
}

async function setTime(i) {
  const v = document.getElementById("set"+i).value.trim();
  if (!v) return;
  const p = v.split(":").map(Number);
  let sec = 0;
  if (p.length===1) sec=p[0]*3600;
  if (p.length===2) sec=p[0]*60+p[1];
  if (p.length===3) sec=p[0]*3600+p[1]*60+p[2];

  await api(`/api/timer/${i}/set`, {
    method:"POST",
    body:JSON.stringify({seconds:sec})
  });
  refresh();
}

async function logSheet() {
  await api("/api/log-now", {method:"POST"});
  refresh();
}

async function logCalendar() {
  await api("/api/calendar/update-now", {method:"POST"});
  refresh();
}

setInterval(refresh, 1000);
refresh();
</script>

</body>
</html>
