<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Work Timers</title>

<style>
body{font-family:Arial;background:#f5f6f7;margin:0;padding:20px}
.wrap{max-width:520px;margin:auto}
h1{text-align:center}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;border:1px solid #ddd;text-align:center}
.timer-time{font-size:58px;font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{padding:12px 16px;font-size:18px;border-radius:10px;border:1px solid #bbb}
.primary{background:#2e7d32;color:#fff}
.danger{background:#1565c0;color:#fff}
.reset{background:#6d4c41;color:#fff}
input.timebox{
  font-size:22px;
  text-align:center;
  width:160px;
  padding:10px;
  border-radius:10px;
  border:1px solid #bbb;
  letter-spacing:2px;
}
.status{border-radius:12px;padding:12px;margin:10px 0}
.good{background:#e9fff0}
.bad{background:#ffe7e7}
</style>
</head>

<body>
<div class="wrap">

<h1>Work Timers ⏱️</h1>
<div id="nowLine" style="text-align:center;margin-bottom:12px"></div>

<div id="sheetBox" class="status">
  <b>Google Sheet</b>
  <div id="sheetMsg"></div>
</div>

<div id="calBox" class="status">
  <b>Google Calendar</b>
  <div id="calMsg"></div>
</div>

<button onclick="post('/api/log-now')">עדכון ידני ל-Sheet</button>
<button onclick="post('/api/calendar/update-now')">עדכון יומן</button>

<!-- TIMER 1 -->
<div class="card">
  <h2>טיימר 1</h2>
  <div class="timer-time" id="t1">00:00:00</div>

  <div class="row">
    <button class="danger" onclick="post('/api/timer/1/stop')">Stop</button>
    <button class="primary" onclick="post('/api/timer/1/start')">Start</button>
  </div>

  <div class="row">
    <button class="reset" onclick="post('/api/timer/1/reset')">Reset</button>
  </div>

  <div class="row">
    <button onclick="adjust(1,300)">+5 דק</button>
    <button onclick="adjust(1,-600)">-10 דק</button>
  </div>

  <div class="row">
    <input id="set1" class="timebox" value="00:00:00"
           oninput="maskTime(this)">
    <button onclick="setMaskedTime(1)">Set</button>
  </div>
</div>

<!-- TIMER 2 -->
<div class="card">
  <h2>טיימר 2</h2>
  <div class="timer-time" id="t2">00:00:00</div>

  <div class="row">
    <button class="danger" onclick="post('/api/timer/2/stop')">Stop</button>
    <button class="primary" onclick="post('/api/timer/2/start')">Start</button>
  </div>

  <div class="row">
    <button class="reset" onclick="post('/api/timer/2/reset')">Reset</button>
  </div>

  <div class="row">
    <button onclick="adjust(2,300)">+5 דק</button>
    <button onclick="adjust(2,-600)">-10 דק</button>
  </div>

  <div class="row">
    <input id="set2" class="timebox" value="00:00:00"
           oninput="maskTime(this)">
    <button onclick="setMaskedTime(2)">Set</button>
  </div>
</div>

</div>

<script>
let editing=false;

async function post(url,body){
  await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});
}

function adjust(i,delta){
  post(`/api/timer/${i}/adjust`,{delta});
}

/* ====== TIME MASK ====== */
function maskTime(el){
  let v = el.value.replace(/\D/g,'').slice(0,6);
  while(v.length<6) v='0'+v;
  el.value = v.slice(0,2)+':'+v.slice(2,4)+':'+v.slice(4,6);
}

function setMaskedTime(i){
  const el=document.getElementById('set'+i);
  const [h,m,s]=el.value.split(':').map(Number);
  const sec=h*3600+m*60+s;
  post(`/api/timer/${i}/set`,{seconds:sec});
}

/* ====== STATUS ====== */
async function refresh(){
  const j=await fetch('/api/status').then(r=>r.json());
  document.getElementById('nowLine').innerText=j.now_str;

  document.getElementById('t1').innerText=j.timers[0];
  document.getElementById('t2').innerText=j.timers[1];

  document.getElementById('sheetBox').className='status '+(j.sheet.ok?'good':'bad');
  document.getElementById('sheetMsg').innerText=j.sheet.msg||'—';

  document.getElementById('calBox').className='status '+(j.calendar.ok?'good':'bad');
  document.getElementById('calMsg').innerText=j.calendar.msg||'—';
}

refresh();
setInterval(refresh,1000);
</script>
</body>
</html>
