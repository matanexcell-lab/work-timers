<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>
<style>
body {
  font-family: Arial;
  background: #ddd;
  text-align: center;
}
.card {
  background: #eee;
  padding: 20px;
  margin: 15px auto;
  width: 260px;
  border-radius: 10px;
}
button {
  font-size: 18px;
  margin: 5px;
  padding: 8px 16px;
}
#topTime {
  margin-top: 6px;
  font-size: 16px;
}
</style>
</head>
<body>

<h2>⏱ Work Timers</h2>
<div id="topTime">—</div>

<div class="card">
  <h3>Timer 1</h3>
  <div id="t1">00:00:00</div>
  <button onclick="call('/api/timer/1/start')">▶ Start</button>
  <button onclick="call('/api/timer/1/stop')">⏸ Stop</button>
  <button onclick="call('/api/timer/1/reset')">🔄 Reset</button>
</div>

<div class="card">
  <h3>Timer 2</h3>
  <div id="t2">00:00:00</div>
  <button onclick="call('/api/timer/2/start')">▶ Start</button>
  <button onclick="call('/api/timer/2/stop')">⏸ Stop</button>
  <button onclick="call('/api/timer/2/reset')">🔄 Reset</button>
</div>

<button onclick="logNow()">✏ עדכן עכשיו Google Sheet</button>

<h3>🧪 סימולציה</h3>
<input type="date" id="simDate">
<input type="time" id="simTime">
<br>
<button onclick="simulate(true)">הפעל סימולציה</button>
<button onclick="simulate(false)">בטל סימולציה</button>

<script>
async function refresh() {
  const r = await fetch('/api/status');
  const d = await r.json();
  document.getElementById('topTime').innerText =
    d.now + (d.simulated ? ' (סימולציה)' : '');
  document.getElementById('t1').innerText = d.timers[0];
  document.getElementById('t2').innerText = d.timers[1];
}
setInterval(refresh, 1000);
refresh();

function call(url) {
  fetch(url, {method:'POST'});
}

function logNow() {
  fetch('/api/log-now', {method:'POST'})
    .then(r=>r.json())
    .then(d=>alert(JSON.stringify(d)));
}

function simulate(on) {
  fetch('/api/simulate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      enabled: on,
      date: document.getElementById('simDate').value,
      time: document.getElementById('simTime').value
    })
  });
}
</script>

</body>
</html>
