<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>
<style>
body{font-family:Arial;background:#f2f2f2;text-align:center;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin:15px auto;max-width:360px}
.timer{font-size:38px;margin:10px}
button,input{font-size:18px;padding:10px;margin:5px}
.sim{color:red}
</style>
</head>

<body>

<h1>⏱ Work Timers</h1>
<div id="now"></div>

<div class="card">
<h2>טיימר 1</h2>
<div class="timer" id="t1">00:00:00</div>
<input type="time" step="1" id="e1">
<br>
<button onclick="start(1)">Start</button>
<button onclick="stop(1)">Stop</button>
<button onclick="reset(1)">Reset</button>
<button onclick="setTime(1)">קבע זמן</button>
</div>

<div class="card">
<h2>טיימר 2</h2>
<div class="timer" id="t2">00:00:00</div>
<input type="time" step="1" id="e2">
<br>
<button onclick="start(2)">Start</button>
<button onclick="stop(2)">Stop</button>
<button onclick="reset(2)">Reset</button>
<button onclick="setTime(2)">קבע זמן</button>
</div>

<div class="card">
<button onclick="logNow()">✏️ עדכון ידני ל-Google Sheet</button>
</div>

<div class="card">
<h3>🧪 סימולציה</h3>
<input type="date" id="sd">
<input type="time" id="st">
<br>
<button onclick="simStart()">הפעל</button>
<button onclick="simStop()">כבה</button>
</div>

<script>
async function refresh(){
  const r = await fetch("/api/status");
  const d = await r.json();
  document.getElementById("now").innerText = d.now_str + (d.simulation?" (סימולציה)":"");
  document.getElementById("now").className = d.simulation?"sim":"";
  document.getElementById("t1").innerText = d.timers[0];
  document.getElementById("t2").innerText = d.timers[1];
}
setInterval(refresh,1000); refresh();

function start(i){fetch(`/api/timer/${i}/start`,{method:"POST"})}
function stop(i){fetch(`/api/timer/${i}/stop`,{method:"POST"})}
function reset(i){fetch(`/api/timer/${i}/reset`,{method:"POST"})}

function setTime(i){
  const v=document.getElementById("e"+i).value;
  if(!v)return;
  fetch(`/api/timer/${i}/set-time`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({time:v.length==5?v+":00":v})
  })
}

function logNow(){fetch("/api/log-now",{method:"POST"})}
function simStart(){
  fetch("/api/sim/start",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({datetime:sd.value+" "+st.value})})
}
function simStop(){fetch("/api/sim/stop",{method:"POST"})}
</script>

</body>
</html>
