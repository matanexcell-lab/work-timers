<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  text-align: center;
  padding: 20px;
}
.card {
  background: white;
  padding: 20px;
  margin: 15px auto;
  max-width: 300px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.timer {
  font-size: 32px;
  margin: 10px 0;
}
button {
  font-size: 18px;
  padding: 8px 18px;
  margin: 5px;
}
</style>
</head>

<body>

<h1>⏱ Work Timers</h1>
<div id="now">טוען...</div>

<div class="card">
  <h2>טיימר 1</h2>
  <div class="timer" id="t1">00:00:00</div>
  <button onclick="start(1)">▶ Start</button>
  <button onclick="stop(1)">⏸ Stop</button>
  <button onclick="resetT(1)">🔄 Reset</button>
</div>

<div class="card">
  <h2>טיימר 2</h2>
  <div class="timer" id="t2">00:00:00</div>
  <button onclick="start(2)">▶ Start</button>
  <button onclick="stop(2)">⏸ Stop</button>
  <button onclick="resetT(2)">🔄 Reset</button>
</div>

<script>
async function refresh(){
  const r = await fetch("/api/status");
  const d = await r.json();
  document.getElementById("now").innerText = d.now_str;
  document.getElementById("t1").innerText = d.timers[0];
  document.getElementById("t2").innerText = d.timers[1];
}

setInterval(refresh, 1000);
refresh();

function start(i){ fetch(`/api/timer/${i}/start`, {method:"POST"}); }
function stop(i){ fetch(`/api/timer/${i}/stop`, {method:"POST"}); }
function resetT(i){ fetch(`/api/timer/${i}/reset`, {method:"POST"}); }
</script>

</body>
</html>
