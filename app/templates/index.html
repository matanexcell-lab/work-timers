<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Work Timers</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f6f7; margin:0; }
    .wrap { max-width:720px; margin:0 auto; padding:16px; }
    h1 { text-align:center; margin:10px 0 6px; }
    .now { text-align:center; color:#333; margin-bottom:10px; }
    .banner { border-radius:10px; padding:10px 12px; margin:10px 0; }
    .ok { background:#e8fff0; border:1px solid #bfe7c8; }
    .bad { background:#ffecec; border:1px solid #f0b4b4; }
    .banner .title { font-weight:700; margin-bottom:4px; }
    .muted { color:#666; font-size:13px; }

    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    .btn.primary { background:#2e7d32; color:#fff; border:none; }
    .btn.stop { background:#1976d2; color:#fff; border:none; }
    .btn.reset { background:#6d4c41; color:#fff; border:none; }
    .btn.gray { background:#eceff1; }
    .card { background:#fff; border-radius:16px; padding:14px; margin:12px 0; box-shadow:0 1px 8px rgba(0,0,0,.06); }
    .timerTitle { text-align:center; font-size:20px; font-weight:700; margin:6px 0; }
    .time { text-align:center; font-size:64px; font-weight:800; letter-spacing:1px; margin:10px 0; }

    .setBox { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:10px; }
    input[type="text"] {
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:18px;
      width:240px;
      text-align:center;
      direction:ltr;
    }
    .small { font-size:12px; color:#777; text-align:center; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>⏱️ Work Timers</h1>
  <div class="now" id="nowLine">טוען…</div>

  <div id="sheetBanner" class="banner ok" style="display:none;">
    <div class="title">Google Sheet</div>
    <div id="sheetMsg"></div>
    <div class="muted" id="sheetAt"></div>
  </div>

  <div id="calBanner" class="banner ok" style="display:none;">
    <div class="title">Google Calendar</div>
    <div id="calMsg"></div>
    <div class="muted" id="calAt"></div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn gray" onclick="post('/api/log-now')">📄 עדכן עכשיו ל-Sheet</button>
      <button class="btn gray" onclick="post('/api/calendar/update-now')">📅 עדכן עכשיו ל-Calendar</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn gray" onclick="simStart()">🧪 הפעל סימולציה</button>
      <button class="btn gray" onclick="post('/api/sim/stop')">עצור סימולציה</button>
    </div>
    <div class="small" id="modeLine"></div>
  </div>

  <!-- Timer 1 -->
  <div class="card">
    <div class="timerTitle">טיימר 1</div>
    <div class="time" id="t1">00:00:00</div>
    <div class="row">
      <button class="btn primary" onclick="post('/api/timer/1/start')">Start</button>
      <button class="btn stop" onclick="post('/api/timer/1/stop')">Stop</button>
      <button class="btn reset" onclick="post('/api/timer/1/reset')">Reset</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" onclick="adjust(1,300)">+5 דק</button>
      <button class="btn" onclick="adjust(1,-600)">−10 דק</button>
    </div>
    <div class="setBox">
      <input id="set1" placeholder="HH:MM:SS / MM:SS / HH">
      <button class="btn" onclick="setTimer(1)">Set</button>
    </div>
  </div>

  <!-- Timer 2 -->
  <div class="card">
    <div class="timerTitle">טיימר 2</div>
    <div class="time" id="t2">00:00:00</div>
    <div class="row">
      <button class="btn primary" onclick="post('/api/timer/2/start')">Start</button>
      <button class="btn stop" onclick="post('/api/timer/2/stop')">Stop</button>
      <button class="btn reset" onclick="post('/api/timer/2/reset')">Reset</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" onclick="adjust(2,300)">+5 דק</button>
      <button class="btn" onclick="adjust(2,-600)">−10 דק</button>
    </div>
    <div class="setBox">
      <input id="set2" placeholder="HH:MM:SS / MM:SS / HH">
      <button class="btn" onclick="setTimer(2)">Set</button>
    </div>
  </div>
</div>

<script>
async function post(url, body) {
  await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : '{}'
  });
}

function parseTime(s){
  if(!s) return null;
  s=s.trim();
  if(s.includes(':')){
    const p=s.split(':').map(Number);
    if(p.some(isNaN)) return null;
    if(p.length===2) return p[0]*60+p[1];
    if(p.length===3) return p[0]*3600+p[1]*60+p[2];
    return null;
  }
  if(isNaN(Number(s))) return null;
  return Number(s)*3600;
}

async function setTimer(i){
  const v=document.getElementById('set'+i).value;
  const sec=parseTime(v);
  if(sec==null){ alert('פורמט לא תקין'); return; }
  await post(`/api/timer/${i}/set`,{seconds:sec});
}

async function adjust(i,d){
  await post(`/api/timer/${i}/adjust`,{delta:d});
}

async function simStart(){
  const d=prompt('YYYY-MM-DD HH:MM','2026-01-07 08:00');
  if(!d) return;
  await post('/api/sim/start',{datetime:d});
}

async function refresh(){
  const r=await fetch('/api/status');
  const d=await r.json();

  nowLine.textContent = d.now_str + (d.simulation?' (SIM)':'');
  modeLine.textContent = d.simulation?'סימולציה פעילה':'מצב אמיתי';

  t1.textContent=d.timers[0];
  t2.textContent=d.timers[1];

  sheetBanner.style.display='block';
  sheetBanner.className='banner '+(d.sheet.ok?'ok':'bad');
  sheetMsg.textContent=d.sheet.msg||'';
  sheetAt.textContent=d.sheet.at||'';

  calBanner.style.display='block';
  calBanner.className='banner '+(d.calendar.ok?'ok':'bad');
  calMsg.textContent=d.calendar.msg||'';
  calAt.textContent=d.calendar.at||'';
}

refresh();

/* ✅ התיקון החשוב */
setInterval(refresh, 1000);
</script>
</body>
</html>
