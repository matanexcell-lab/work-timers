<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Work Timers</title>
<style>
body { font-family: Arial; padding: 20px }
button { font-size: 18px; padding: 10px 20px; margin: 5px }
.timer { font-size: 32px; margin: 10px 0 }
#nowTitle { font-size: 22px; font-weight: bold; margin-bottom: 15px }
.sim { color: red }
</style>
</head>
<body>

<div id="nowTitle">טוען...</div>

<div class="timer">טיימר 1: <span id="timer-1">00:00:00</span></div>
<button onclick="start(1)">Start</button>
<button onclick="stop(1)">Stop</button>
<button onclick="resetT(1)">Reset</button>

<hr>

<div class="timer">טיימר 2: <span id="timer-2">00:00:00</span></div>
<button onclick="start(2)">Start</button>
<button onclick="stop(2)">Stop</button>
<button onclick="resetT(2)">Reset</button>

<hr>
<button onclick="logNow()">✏️ עדכן עכשיו Google Sheet</button>
<div id="logResult"></div>

<hr>
<h3>סימולציה</h3>
<input type="date" id="simDate">
<input type="time" id="simTime">
<br><br>
<button onclick="startSim()">הפעל סימולציה</button>
<button onclick="stopSim()">כבה סימולציה</button>

<script>
async function refreshStatus() {
  const r = await fetch("/api/status");
  const d = await r.json();

  document.getElementById("nowTitle").innerText =
    d.now_str + (d.simulation ? " (סימולציה)" : "");

  d.simulation
    ? nowTitle.classList.add("sim")
    : nowTitle.classList.remove("sim");

  d.timers.forEach((t, i) => {
    document.getElementById(`timer-${i+1}`).innerText = t;
  });
}

setInterval(refreshStatus, 1000);
refreshStatus();

function start(i){ fetch(`/api/timer/${i}/start`,{method:"POST"}) }
function stop(i){ fetch(`/api/timer/${i}/stop`,{method:"POST"}) }
function resetT(i){ fetch(`/api/timer/${i}/reset`,{method:"POST"}) }

async function logNow(){
  const r = await fetch("/api/log-now",{method:"POST"});
  const d = await r.json();
  logResult.innerText = d.ok ? "✔ נכתב ל-Google Sheet" : "❌ " + d.error;
}

async function startSim(){
  await fetch("/api/sim/start",{method:"POST",headers:{'Content-Type':'application/json'},
    body:JSON.stringify({datetime:simDate.value+" "+simTime.value})
  });
}

async function stopSim(){
  await fetch("/api/sim/stop",{method:"POST"});
}
</script>

</body>
</html>
