<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Work Timers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    h1 { margin-bottom: 6px; }

    .time {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .status-box {
      margin: 10px auto;
      padding: 10px;
      max-width: 420px;
      border-radius: 8px;
      font-size: 14px;
    }

    .ok {
      background: #e6f7ec;
      border: 1px solid #4caf50;
      color: #1b5e20;
    }

    .err {
      background: #fdecea;
      border: 1px solid #f44336;
      color: #b71c1c;
    }

    .timer {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin: 16px auto;
      max-width: 360px;
    }

    .timer-time {
      font-size: 48px;
      margin: 12px 0;
    }

    button {
      padding: 10px 16px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .start { background: #2e7d32; color: white; }
    .stop  { background: #1565c0; color: white; }
    .reset { background: #6d4c41; color: white; }

    .adj { background: #546e7a; color: white; }

    input {
      padding: 8px;
      font-size: 16px;
      width: 80%;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>⏱ Work Timers</h1>

<div class="time" id="now">--</div>

<!-- ===== SHEET STATUS ===== -->
<div id="sheetStatus" class="status-box"></div>

<!-- ===== CALENDAR STATUS ===== -->
<div id="calendarStatus" class="status-box"></div>

<div class="timer">
  <h2>טיימר 1</h2>
  <div class="timer-time" id="t1">00:00:00</div>

  <button class="start" onclick="post('/api/timer/1/start')">▶ Start</button>
  <button class="stop" onclick="post('/api/timer/1/stop')">⏸ Stop</button>
  <br/>
  <button class="reset" onclick="post('/api/timer/1/reset')">🔄 Reset</button>
  <br/>
  <button class="adj" onclick="adjust(1, 300)">+5 דקות</button>
  <button class="adj" onclick="adjust(1, -600)">-10 דקות</button>

  <br/>
  <input id="set1" placeholder="HH:MM:SS או MM:SS או HH" />
  <br/>
  <button onclick="setTimer(1)">Set</button>
</div>

<script>
async function fetchStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();

  document.getElementById('now').innerText = data.now_str || '--';
  document.getElementById('t1').innerText = data.timers[0];

  // ===== SHEET =====
  const sheet = data.sheet || {};
  const sheetDiv = document.getElementById('sheetStatus');

  if (sheet.ok === "1") {
    sheetDiv.className = "status-box ok";
    sheetDiv.innerHTML = "✅ Google Sheet: " + (sheet.msg || "OK");
  } else if (sheet.ok === "0") {
    sheetDiv.className = "status-box err";
    sheetDiv.innerHTML =
      "❌ Google Sheet:<br/>" +
      "<b>" + (sheet.msg || "שגיאה לא ידועה") + "</b>";
  } else {
    sheetDiv.innerHTML = "";
  }

  // ===== CALENDAR =====
  const cal = data.calendar || {};
  const calDiv = document.getElementById('calendarStatus');

  if (cal.ok === "1") {
    calDiv.className = "status-box ok";
    calDiv.innerHTML = "✅ יומן: " + (cal.msg || "עודכן");
  } else if (cal.ok === "0") {
    calDiv.className = "status-box err";
    calDiv.innerHTML =
      "❌ יומן:<br/>" +
      "<b>" + (cal.msg || "שגיאה לא ידועה") + "</b>";
  } else {
    calDiv.innerHTML = "";
  }
}

async function post(url, body=null) {
  await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : null
  });
}

function adjust(id, delta) {
  post(`/api/timer/${id}/adjust`, {delta});
}

function setTimer(id) {
  const v = document.getElementById('set1').value.trim();
  if (!v) return;

  let parts = v.split(':').map(Number);
  let sec = 0;

  if (parts.length === 3)
    sec = parts[0]*3600 + parts[1]*60 + parts[2];
  else if (parts.length === 2)
    sec = parts[0]*60 + parts[1];
  else if (parts.length === 1)
    sec = parts[0]*3600;

  post(`/api/timer/${id}/set`, {seconds: sec});
}

setInterval(fetchStatus, 1000);
fetchStatus();
</script>

</body>
</html>
